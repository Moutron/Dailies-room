[project]
name = "dailies-room"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-adk",
    "google-genai",
    "google-cloud-storage",
    "google-cloud-secret-manager",
    "clickhouse-connect",
    "pydantic",
    "python-dotenv",
    "tenacity",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "pre-commit"]
ui = ["fastapi", "uvicorn[standard]"]
deploy = ["google-cloud-aiplatform[adk,agent_engines]"]

[tool.setuptools.packages.find]
include = ["agent*", "schema*", "pipeline*", "ui", "ui.server"]

[tool.ruff]
line-length = 100
target-version = "py310"
