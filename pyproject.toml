[project]
name = "dailies-room"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-adk",
    "google-genai",
    "google-cloud-storage",
    "google-cloud-secret-manager",
    "clickhouse-connect",
    "pydantic",
    "python-dotenv",
    "tenacity",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "pre-commit"]
ui = ["fastapi", "uvicorn[standard]"]
deploy = ["google-cloud-aiplatform[adk,agent_engines]"]

[tool.setuptools.packages.find]
include = ["agent*", "schema*", "pipeline*", "ui", "ui.server"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Explicit rather than relying on ruff's project-root auto-detection, which
# was observed to classify these as third-party (merging their import group
# with pytest's) in CI but not locally — same ruff version, same pyproject,
# cause not pinned down. Being explicit removes the dependency on it.
[tool.ruff.lint.isort]
known-first-party = ["agent", "pipeline", "schema", "ui"]
