services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123" # HTTP interface (clickhouse_connect uses this)
      - "9000:9000" # native protocol
    environment:
      CLICKHOUSE_DB: DailiesRoom
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: local-dev-only # pragma: allowlist secret — fixed placeholder for the local-only container, not a real credential
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./schema/clickhouse.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  clickhouse-data:
